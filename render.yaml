# Render blueprint — config-as-code for the tekivex-ui deploy.
#
# ONE service, ONE domain (ui.tekivex.com). Three deliverables are built
# and merged into a single static directory:
#
#   /                  → Astro Starlight docs    (canonical)
#   /playground/       → demo/ React SPA          (interactive sandbox)
#   /book/             → packages/tkx-book/       (component catalog)
#
# How the merge works:
#   scripts/build-unified-site.mjs runs three Vite builds with different
#   base paths, then copies the demo + book outputs into subfolders of
#   docs-site/dist. Render serves the merged dist as a single static site.
#
# Why this layout instead of three subdomains:
#   - One SSL cert, one DNS record, one CDN cache
#   - Cross-links use relative URLs (/playground/...) — no CORS, no leaks
#   - Google sees one site for SEO; no canonical-URL fragmentation
#   - Render Hobby-tier custom-domain quota is preserved for future apps
#
# ─── ONE-TIME SETUP IN THE RENDER DASHBOARD ─────────────────────────────
#
#   1. Repo is already linked. Render auto-detects this YAML.
#   2. The previously-separate `tekivex-ui-playground` and
#      `tekivex-ui-book` services should be SUSPENDED (or deleted) in the
#      dashboard — they're no longer in this blueprint, so Render won't
#      manage them. Their custom domains (if any) should be removed
#      before suspending so the records can be reused.
#   3. The remaining `tekivex-ui` service keeps the ui.tekivex.com domain.
#
# ────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: tekivex-ui
    runtime: static
    rootDir: .
    buildCommand: npm install --no-audit --no-fund && node scripts/build-unified-site.mjs
    staticPublishPath: docs-site/dist
    pullRequestPreviewsEnabled: true
    branch: master

    headers:
      # Top-level headers for all paths
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

      # Long-cache hashed asset bundles
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /playground/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /book/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # HTML — never cache, so deploys roll out instantly
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

    # SPA fallbacks for the two embedded apps. Order matters — most-
    # specific paths first. Render evaluates them top-down and stops at
    # the first match.
    routes:
      - type: rewrite
        source: /playground/*
        destination: /playground/index.html
      - type: rewrite
        source: /book/*
        destination: /book/index.html
      # Astro produces real HTML files for every doc page, so it doesn't
      # need a catch-all rewrite — Render's static handler finds them
      # directly.
