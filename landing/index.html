<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TekiVex UI — Production-grade React components, in 360°</title>
    <meta
      name="description"
      content="Open-source React component library: 113 accessible primitives, a WebGL 3D + 360° toolkit, holographic UI, browser-native PDF, and printable templates. MIT licensed, WCAG 2.1 AAA."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="author" content="TekiVex UI contributors" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://ui.tekivex.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TekiVex UI" />
    <meta property="og:title" content="TekiVex UI — Production-grade React components, in 360°" />
    <meta
      property="og:description"
      content="113 accessible React components, a WebGL 3D + 360° toolkit, holographic UI, and browser-native PDF. MIT licensed."
    />
    <meta property="og:url" content="https://ui.tekivex.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TekiVex UI — Production-grade React components, in 360°" />
    <meta
      name="twitter:description"
      content="113 accessible React components, a WebGL 3D + 360° toolkit, holographic UI, and browser-native PDF. MIT licensed."
    />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

    <!-- Structured data: Organization + WebSite for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "TekiVex UI",
            "url": "https://ui.tekivex.com/",
            "logo": "https://ui.tekivex.com/favicon.svg",
            "sameAs": [
              "https://www.npmjs.com/package/tekivex-ui",
              "https://www.npmjs.com/package/tekivex-3d",
              "https://github.com/novaai0401-ui/tekivex-issue-report"
            ]
          },
          {
            "@type": "WebSite",
            "name": "TekiVex UI documentation",
            "url": "https://ui.tekivex.com/",
            "inLanguage": "en",
            "publisher": { "@type": "Organization", "name": "TekiVex UI" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://ui.tekivex.com/docs?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "TekiVex UI",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "license": "https://opensource.org/licenses/MIT"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;color:#dcdce8;background:#0a0a0f">
        <h1>TekiVex UI</h1>
        <p>
          TekiVex UI is an open-source React component library. The interactive
          documentation requires JavaScript, but you can browse the project on
          <a href="https://www.npmjs.com/package/tekivex-ui" style="color:#00f5d4">npm</a>
          or read the source on
          <a href="https://github.com/novaai0401-ui/tekivex-issue-report" style="color:#00f5d4">GitHub</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
