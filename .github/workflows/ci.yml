name: TekiVex UI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: 2. Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install React ${{ matrix.react-version }}
        run: |
          if [ "${{ matrix.react-version }}" = "19" ]; then
            npm install --save-dev react@19 react-dom@19
          fi
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-react-${{ matrix.react-version }}
          path: coverage/

  a11y:
    name: 3. Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/a11y-audit.mjs
      - run: node scripts/css-build.mjs

  security:
    name: 4. Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/security-audit.mjs

  build:
    name: 5. Build
    runs-on: ubuntu-latest
    needs: [lint, test, a11y, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  sbom:
    name: 6. SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@2 --output-format JSON --output-file sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  publish:
    name: 7. Publish to npm (signed + provenance)
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.event_name == 'release' && github.event.action == 'created'
    # OIDC token for sigstore-based npm provenance attestations.
    # Requires the repo to be public OR have GitHub Actions OIDC enabled,
    # and the npm package must be published from this exact workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Generate SBOM for release
        run: npx --yes @cyclonedx/cyclonedx-npm@2 --output-format JSON --output-file sbom.cdx.json
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json
