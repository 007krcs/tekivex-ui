name: Deploy docs-site to GitHub Pages

# This workflow is the FALLBACK path. The primary deploy target is
# Cloudflare Pages (.github/workflows/deploy-cloudflare.yml). GitHub Pages
# is here so the site has a second hosting option that's:
#   1. Almost always reachable from corporate networks
#   2. Free and bound to the repo's lifecycle
#   3. Set up via repo settings, no external service needed
#
# To activate: GitHub repo Settings → Pages → Source: GitHub Actions.
# Then enable this workflow.

on:
  workflow_dispatch:
  # Uncomment the push trigger to make every commit also deploy here.
  # push:
  #   branches: [master, main]
  #   paths: ['docs-site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: docs-site
        run: |
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
