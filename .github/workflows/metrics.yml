name: Weekly metrics snapshot

on:
  schedule:
    - cron: '0 12 * * 1'  # Monday noon UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-metrics.mjs

      - name: Commit snapshot
        run: |
          git config user.name 'tekivex-metrics-bot'
          git config user.email 'metrics-bot@users.noreply.github.com'
          git add metrics/
          git diff --cached --quiet || git commit -m "chore(metrics): weekly snapshot"
          git push
