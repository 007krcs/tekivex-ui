    <!-- ── WCAG 2.1 AAA + Responsive Mobile/Tablet/Desktop Baseline ─────── -->
    <style>
      :focus-visible {
        outline: 2px solid #00f5d4;
        outline-offset: 2px;
        border-radius: 3px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
      }
      img, video, canvas, svg, iframe {
        max-width: 100%;
        height: auto;
      }
      .tkx-skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        background: #00f5d4;
        color: #0a0a0f;
        padding: 12px 20px;
        font-weight: 700;
        text-decoration: none;
        z-index: 10000;
        border-radius: 0 0 8px 0;
      }
      .tkx-skip-link:focus {
        top: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* ── Mobile (≤640 px) — collapse rigid grids and trim padding ────── */
      @media (max-width: 640px) {
        /* Any inline-style grid with multiple columns collapses to 1 */
        [style*="grid-template-columns"] {
          grid-template-columns: 1fr !important;
        }
        /* Trim large horizontal padding */
        [style*="padding: 48px 32px"],
        [style*="padding:48px 32px"] {
          padding: 24px 16px 40px !important;
        }
        [style*="padding: 40px 32px"],
        [style*="padding:40px 32px"] {
          padding: 20px 16px !important;
        }
        [style*="padding: 32px"],
        [style*="padding:32px"] {
          padding: 16px !important;
        }
        [style*="padding: 80px 40px"],
        [style*="padding:80px 40px"] {
          padding: 40px 20px !important;
        }
        [style*="padding: 0 32px"],
        [style*="padding:0 32px"] {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
        /* Hero headlines wrap better on small screens */
        h1 {
          word-wrap: break-word;
          overflow-wrap: break-word;
        }
        /* Tables become horizontally scrollable instead of overflowing the layout */
        table {
          display: block;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
      }
      /* ── Tablet (641–960 px) — reduce 4-col grids to 2-col, keep some padding */
      @media (min-width: 641px) and (max-width: 960px) {
        [style*="repeat(4, 1fr)"] {
          grid-template-columns: repeat(2, 1fr) !important;
        }
        [style*="repeat(3, 1fr)"] {
          grid-template-columns: repeat(2, 1fr) !important;
        }
      }
    </style>
